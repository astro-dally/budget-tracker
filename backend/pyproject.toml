[project]
name = "budget-tracker"
version = "1.0.0"
description = "Personal Budget Tracker with Smart Spending Alerts (capstone project)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "PL", "PT", "RET", "ARG", "D100", "D101", "D103", "D104"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "B008", "RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG001", "ARG002", "PLC0415", "D100", "D101", "D103", "D104"]
"alembic/**" = ["E501", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette 1.x nudges TestClient users towards httpx2; harmless for our tests.
    "ignore:Using .httpx. with",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
# The local alembic/ migrations folder shadows the package name for isort.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
